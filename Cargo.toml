[package]
name = "emucore"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Experimental Windows host for a constrained Linux ELF execution runtime"

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
