[package]
name = "emucore"
default-run = "emucore"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Experimental Windows host for a constrained Linux ELF execution runtime"

[dependencies]
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder"] }

[target.'cfg(windows)'.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
